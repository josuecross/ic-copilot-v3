[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-copilot-mvp"
version = "0.1.0"
description = "Phase 1 IC Copilot / live incident meeting whisperer MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.5",
]
live-openai = [
  "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "live_openai: opt-in tests that make live OpenAI shadow calls; skipped unless explicitly enabled",
  "contract: stable contract fixture tests",
  "personal_regression: generated personal regression view tests",
  "curation: offline corpus/artifact/previous-incident curation tests",
  "dev_eval: developer/eval fixture and generated-data tests",
  "live_provider: opt-in tests that require a configured live provider",
]

[tool.ruff]
line-length = 100
target-version = "py311"
