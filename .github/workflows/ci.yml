name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff correctness checks
        run: ruff check . --select E9,F63,F7,F82

      - name: Public-safe pytest suite
        run: |
          # The public repository intentionally omits the incident corpora and
          # local knowledge used by the full private regression suite. Keep CI
          # meaningful by running every self-contained/public-fixture test and
          # excluding only modules that require those unpublished fixtures or
          # historical phase-status assertions.
          pytest -q \
            --ignore=tests/contract/test_normalizer_contract.py \
            --ignore=tests/contract/test_planner_verifier_contract.py \
            --ignore=tests/contract/test_replay_fixtures.py \
            --ignore=tests/contract/test_state_extractor_contract.py \
            --ignore=tests/contract/test_state_merger_contract.py \
            --ignore=tests/test_architecture_invariants.py \
            --ignore=tests/test_eval_runner.py \
            --ignore=tests/test_incident_read_envelope_simplified.py \
            --ignore=tests/test_llm_readiness.py \
            --ignore=tests/test_memory.py \
            --ignore=tests/test_phase115_repo_status.py \
            --ignore=tests/test_phase119_repo_cleanup.py \
            --ignore=tests/test_phase120_docs_status.py \
            --ignore=tests/test_phase122_product_smoke.py \
            --ignore=tests/test_phase122_web_provider_failures.py \
            --ignore=tests/test_phase125_product_runtime.py \
            --ignore=tests/test_phase1261_security_move_robustness.py \
            --ignore=tests/test_phase126_trust_post.py \
            --ignore=tests/test_phase127_clean_context_semantic_intent.py \
            --ignore=tests/test_phase129_sharp_blocker.py \
            --ignore=tests/test_phase130_large_input_resilience.py \
            --ignore=tests/test_phase131_role_targeting.py \
            --ignore=tests/test_phase132_incident_brief.py \
            --ignore=tests/test_phase134_target_selection.py \
            --ignore=tests/test_phase135_bounded_incident_brief.py \
            --ignore=tests/test_phase136a_artifacts_semantic_read.py \
            --ignore=tests/test_phase136b_evidence_target_gating.py \
            --ignore=tests/test_phase16_adversarial.py \
            --ignore=tests/test_product_pipeline_defaults.py \
            --ignore=tests/test_raw_paste_product_eval.py \
            --ignore=tests/test_revpro_end_to_end.py \
            --ignore=tests/test_trace_contract.py \
            --ignore=tests/test_verifier.py \
            --ignore=tests/test_web_app.py \
            --ignore=tests/test_web_phase18_usability.py \
            --ignore=tests/test_web_pipeline_events.py
