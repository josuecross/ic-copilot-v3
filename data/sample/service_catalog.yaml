services:
  - service_id: revpro
    canonical_name: RevPro
    aliases: ["revpro", "RevPro deployment", "RevPro version"]
    kind: service
    status: active
    criticality: high
    ownership:
      owning_team: RevPro Support
      support_team: RevPro Support
    slack:
      channel: "#revpro-support"
    oncall: {}
    runbooks: ["https://runbooks.example.invalid/revpro"]
    dashboards: ["https://dashboards.example.invalid/revpro"]
    known_commands: []
    dependencies: []
    environments: ["prod", "sandbox"]
    known_signals: ["deployment version mismatch", "invoice generation errors"]
    unsafe_assumptions: ["Do not infer customer from RevPro URL paths."]

  - service_id: revpro-support
    canonical_name: RevPro Support
    aliases: ["revpro support", "RevPro support", "RevPro Support team", "RevPro oncall"]
    kind: team
    status: active
    criticality: high
    ownership:
      owning_team: RevPro Support
    slack:
      channel: "#revpro-support"
    oncall:
      lookup_command: "@zsrebot oncall RevPro support"
    runbooks: ["https://runbooks.example.invalid/revpro-support"]
    dashboards: ["https://dashboards.example.invalid/revpro-support"]
    known_commands:
      - type: oncall
        command: "@zsrebot oncall RevPro support"
        requires_human_approval: true
        allowed_prefixes: ["@zsrebot oncall"]
    dependencies: ["revpro"]
    environments: ["prod", "sandbox"]
    known_signals: ["deployment version mismatch"]
    unsafe_assumptions: ["Do not page automatically."]

