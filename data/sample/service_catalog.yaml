        requires_human_approval: true
        allowed_prefixes: ["@zsrebot oncall"]
    dependencies: ["revenue", "dune"]
    environments: ["central sandbox", "prod"]
    known_signals: ["RevenueOrgMapping=0"]
    unsafe_assumptions: ["Do not infer tenant IDs from docs URLs."]

